spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-only-secret-key-do-not-use-in-production-0123456789
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 2592000

  oauth:
    google-client-id: ""
    apple-client-id: ""
