server:
  shutdown: immediate # SSE 등 열린 비동기 요청이 남아있어도 graceful shutdown을 기다리지 않고 바로 종료한다

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-only-secret-key-do-not-use-in-production-0123456789
    validity:
      game:
        access: 15m
        refresh: 30d
      web:
        access: 15m
        refresh: 1h

  cookie:
    secure: false

  social:
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
      client-ids: test-google-client-id
    apple:
      jwk-set-uri: https://appleid.apple.com/auth/keys
      issuers: https://appleid.apple.com
      client-ids: test-apple-client-id
