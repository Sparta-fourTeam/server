spring:
  application:
    name: nova-server
  profiles:
    default: local          # 아무 프로필도 지정 안 하면 local로 실행
  config:
    import: optional:file:.env[.properties] # 프로젝트 폴더의 .env를 읽음

  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 2592000

  oauth:
    google-client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    apple-client-id: ${APPLE_OAUTH_CLIENT_ID:}
