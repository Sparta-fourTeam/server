spring:
  application:
    name: nova-server
  profiles:
    default: local          # 아무 프로필도 지정 안 하면 local로 실행
  config:
    import: optional:file:.env[.properties] # 프로젝트 폴더의 .env를 읽음

  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${JWT_SECRET}   # 32바이트(256bit) 이상, .env에 정의
    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 2592000

  social:
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
      client-ids: ${GOOGLE_CLIENT_IDS:}   # 쉼표로 구분, ID 토큰의 aud로 허용할 값
    apple:
      jwk-set-uri: https://appleid.apple.com/auth/keys
      issuers: https://appleid.apple.com
      client-ids: ${APPLE_CLIENT_IDS:}    # 번들 ID(·Services ID), 쉼표로 구분
