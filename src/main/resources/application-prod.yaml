spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET}
    validity:
      web:
        access: ${JWT_WEB_ACCESS:15m}
        refresh: ${JWT_WEB_REFRESH:1h}
      game:
        access: ${JWT_GAME_ACCESS:15m}
        refresh: ${JWT_GAME_REFRESH:30d}

  cookie:
    secure: ${COOKIE_SECURE:true}

  social:
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
      client-ids: ${GOOGLE_CLIENT_IDS:}   # 쉼표로 구분, ID 토큰의 aud로 허용할 값
    apple:
      jwk-set-uri: https://appleid.apple.com/auth/keys
      issuers: https://appleid.apple.com
      client-ids: ${APPLE_CLIENT_IDS:}    # 번들 ID(·Services ID), 쉼표로 구분

logging:
  level:
    org.springframework.security: DEBUG
