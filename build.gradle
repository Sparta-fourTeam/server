plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.3'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'nova-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  compileOnly 'org.projectlombok:lombok'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
  annotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testCompileOnly 'org.projectlombok:lombok'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'com.h2database:h2'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0' // Swagger
  implementation 'org.springframework.boot:spring-boot-starter-actuator' // 헬스체크용
}

tasks.named('test') {
  useJUnitPlatform()
}

spotless {
  java {
    target 'src/**/*.java'
    googleJavaFormat('1.36.1').aosp()   // 4스페이스, 구글 스타일 로직
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
  format 'misc', {
    target '*.gradle', '.gitignore'
    trimTrailingWhitespace()
    endWithNewline()
  }
}

checkstyle {
  toolVersion = '14.1.0'
  configFile = file("config/checkstyle/checkstyle.xml")
  maxWarnings = 0
}

tasks.named('compileJava') {
  dependsOn('spotlessCheck')
}

tasks.named('check') {
  dependsOn 'checkstyleMain', 'checkstyleTest'
}
